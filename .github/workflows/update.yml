name: Uppdatera schemat

# Avstängd efter Lund Volley Masters 2026: körs bara när någon trycker
# "Run workflow" under Actions, och gör då en enda kontroll.
#
# Under turneringen höll varje körning igång i knappt sex timmar, kontrollerade
# schemat var tredje minut och startade sedan själv nästa körning. Den versionen
# finns i git-historiken (commit 2450287) om den behövs igen.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kontrollera schemat en gång
        env:
          LVM_SINGLE_RUN: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node scripts/update.mjs
          if ! git diff --quiet -- data/schedule.json; then
            git add data/schedule.json
            git commit --quiet -m "Uppdatera schemat"
            git push --quiet origin HEAD:main
          fi
