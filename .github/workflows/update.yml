name: Uppdatera schemat

on:
  schedule:
    # Var 10:e minut. GitHub kan fördröja schemalagda körningar några minuter.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hämta schemat från turneringen
        run: node scripts/update.mjs
      - name: Spara om något ändrats
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "Inget att spara."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Uppdatera schemat"
          git push
